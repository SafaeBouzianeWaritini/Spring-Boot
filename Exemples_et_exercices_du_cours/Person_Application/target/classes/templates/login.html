<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Connexion</h2>
        
        <div th:if="${param.error}" class="mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg">
            Nom d'utilisateur ou mot de passe incorrect.
        </div>
        <div th:if="${param.logout}" class="mb-4 text-sm text-green-600 bg-green-50 p-3 rounded-lg">
            Déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Utilisateur :</label>
                <input type="text" name="username" required 
                       class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mot de passe :</label>
                <input type="password" name="password" required 
                       class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
