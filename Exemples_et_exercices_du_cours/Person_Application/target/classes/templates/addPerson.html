<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une personne</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Nouvelle Personne</h2>
        
        <form th:action="@{/addPerson}" th:object="${personne}" method="post" class="space-y-4">
            <!-- Informations de la Personne -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Nom :</label>
                <input type="text" th:field="*{nom}" required 
                       class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Prénom :</label>
                <input type="text" th:field="*{prenom}" required 
                       class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Section Adresse -->
            <div class="border-t pt-4 mt-4">
                <h3 class="text-md font-semibold text-gray-700 mb-3">Adresse principale</h3>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Rue :</label>
                        <input type="text" th:field="*{adresses[0].rue}" 
                               class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Ville :</label>
                        <input type="text" th:field="*{adresses[0].ville}" 
                               class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Code Postal :</label>
                        <input type="text" th:field="*{adresses[0].codePostal}" 
                               class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition mt-6">
                Enregistrer
            </button>
        </form>
    </div>
</body>
</html>
