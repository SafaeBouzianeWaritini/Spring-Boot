<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-96 text-center">
        <h2 class="text-2xl font-bold text-green-600 mb-2">Succès !</h2>
        <p class="text-gray-600 mb-6">
            La personne <strong th:text="${prenom} + ' ' + ${nom}"></strong> a été ajoutée.
        </p>
        <a th:href="@{/home}" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition">
            Retour à l'accueil
        </a>
    </div>
</body>
</html>
